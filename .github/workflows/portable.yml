name: ClipNotes Windows and Linux preview
on:
  push:
    paths: ['*.py', 'requirements.txt', 'package-windows.ps1', '.github/workflows/portable.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libpipewire-0.3-0t64
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_clipnotes.py
      - if: runner.os == 'Linux'
        run: QT_QPA_PLATFORM=offscreen python clipnotes.py --smoke-test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install pyinstaller==6.12.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --windowed --name ClipNotes --collect-all faster_whisper --collect-all av --collect-all ctranslate2 --collect-all onnxruntime clipnotes.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $app = Start-Process ./dist/ClipNotes/ClipNotes.exe -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'ClipNotes startup timed out.' }
          if ($app.ExitCode -ne 0) { throw "ClipNotes exited with code $($app.ExitCode)." }
      - if: runner.os == 'Windows' && vars.CLIPNOTES_STORE_IDENTITY != '' && vars.CLIPNOTES_STORE_PUBLISHER != ''
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ vars.CLIPNOTES_STORE_IDENTITY }}
          STORE_PUBLISHER: ${{ vars.CLIPNOTES_STORE_PUBLISHER }}
          STORE_DISPLAY_NAME: ${{ vars.CLIPNOTES_STORE_DISPLAY_NAME }}
        run: |
          $publisherName = if ($env:STORE_DISPLAY_NAME) { $env:STORE_DISPLAY_NAME } else { 'ClipNotes' }
          ./package-windows.ps1 -Identity $env:STORE_IDENTITY -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $publisherName
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClipNotes-Windows-x64-preview
          path: |
            dist/ClipNotes/
            dist/*.msix
          if-no-files-found: error
