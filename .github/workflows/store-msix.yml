name: Package ClipNotes for Microsoft Store
on:
  workflow_dispatch:
    inputs:
      identity:
        description: Partner Center package identity name
        required: true
        type: string
      publisher:
        description: Partner Center package publisher
        required: true
        type: string
      publisher_display_name:
        description: Partner Center publisher display name
        required: true
        type: string
      display_name:
        description: Reserved Microsoft Store app name
        required: true
        type: string
permissions:
  contents: read
jobs:
  store-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and smoke-test the Windows executable
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt pyinstaller==6.12.0
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest -v test_clipnotes.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --windowed --name ClipNotes --icon ClipNotes.ico --add-data 'ClipNotes.png:.' --collect-all faster_whisper --collect-all av --collect-all ctranslate2 --collect-all onnxruntime clipnotes.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $exe = Get-Item dist/ClipNotes/ClipNotes.exe
          $app = Start-Process $exe.FullName -ArgumentList '--smoke-test' -PassThru
          if (!$app.WaitForExit(30000)) { $app.Kill(); throw 'ClipNotes startup timed out.' }
          if ($app.ExitCode -ne 0) { throw "ClipNotes exited with code $($app.ExitCode)." }
          if (!(Test-Path dist/ClipNotes/_internal/ClipNotes.png)) { throw 'The bundled window icon is missing.' }
      - name: Package and verify MSIX
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ inputs.identity }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_NAME: ${{ inputs.publisher_display_name }}
          STORE_PRODUCT_NAME: ${{ inputs.display_name }}
        run: |
          ./package-windows.ps1 -Identity $env:STORE_IDENTITY -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_NAME -DisplayName $env:STORE_PRODUCT_NAME
          [xml]$manifest = Get-Content build/msix/AppxManifest.xml
          if ($manifest.Package.Identity.Name -cne $env:STORE_IDENTITY -or $manifest.Package.Identity.Publisher -cne $env:STORE_PUBLISHER) {
            throw 'The package manifest does not match the Partner Center identity.'
          }
          if ($manifest.Package.Identity.Version -ne '2.1.1.0') { throw 'Unexpected package version.' }
          foreach ($logo in 'StoreLogo.png', 'Square44x44Logo.png', 'Square150x150Logo.png') {
            if ((Get-FileHash $logo).Hash -ne (Get-FileHash "build/msix/Assets/$logo").Hash) { throw "Logo mismatch: $logo" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNotes-Store-MSIX
          path: dist/*.msix
          compression-level: 0
          if-no-files-found: error
