name: Package ClipNotes for Microsoft Store
on:
  workflow_dispatch:
    inputs:
      identity:
        description: Partner Center package identity name
        required: true
        type: string
      publisher:
        description: Partner Center package publisher
        required: true
        type: string
      publisher_display_name:
        description: Partner Center publisher display name
        required: true
        type: string
      display_name:
        description: Reserved Microsoft Store app name
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  store-package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: ClipNotes-Windows-x64-preview
          github-token: ${{ github.token }}
          run-id: '42871681289'
          path: build/verified-preview
      - name: Prepare verified Windows build
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem build/verified-preview -Filter ClipNotes.exe -Recurse)
          if ($executables.Count -ne 1) { throw 'Expected exactly one ClipNotes executable.' }
          New-Item -ItemType Directory dist/ClipNotes -Force | Out-Null
          Copy-Item -Path (Join-Path $executables[0].Directory.FullName '*') -Destination dist/ClipNotes -Recurse
          python -m pip install PySide6==6.8.3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Package and verify MSIX
        shell: pwsh
        env:
          STORE_IDENTITY: ${{ inputs.identity }}
          STORE_PUBLISHER: ${{ inputs.publisher }}
          STORE_PUBLISHER_NAME: ${{ inputs.publisher_display_name }}
          STORE_PRODUCT_NAME: ${{ inputs.display_name }}
        run: |
          ./package-windows.ps1 -Identity $env:STORE_IDENTITY -Publisher $env:STORE_PUBLISHER -PublisherDisplayName $env:STORE_PUBLISHER_NAME -DisplayName $env:STORE_PRODUCT_NAME
          [xml]$manifest = Get-Content build/msix/AppxManifest.xml
          if ($manifest.Package.Identity.Name -cne $env:STORE_IDENTITY -or $manifest.Package.Identity.Publisher -cne $env:STORE_PUBLISHER) {
            throw 'The package manifest does not match the Partner Center identity.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ClipNotes-Store-MSIX
          path: dist/*.msix
          compression-level: 0
          if-no-files-found: error
